# The repository candidates are generated into and evaluated against.
# repo_path defaults to "." (the harness's own repo) for backward
# compatibility, but that mixes the harness's own history with candidate
# branches - point it at a separate checkout to keep them independent.
# base_ref pins the commit/branch candidates are based on and merged back
# onto; leave unset to use repo_path's current branch (or, if repo_path is
# in a detached HEAD state, its current commit).
target:
  repo_path: "."
  # base_ref: main

sandbox:
  timeout_seconds: 5
  cpu_limit: "0.5"
  memory_limit: "256m"
  # Caps process count (fork-bomb protection - CPU/memory limits alone
  # don't bound how many processes a candidate can spawn), open file
  # descriptors per process, and the writable /tmp tmpfs size (tmpfs is
  # RAM-backed, so an unbounded one can exhaust host memory).
  pids_limit: 128
  ulimit_nofile: 1024
  tmpfs_size_mb: 64
  # /app/out is a real host bind mount (rw), not a tmpfs - Docker has no
  # --tmpfs-style size flag for a bind mount, so nothing on the docker run
  # command line can cap it the way tmpfs_size_mb caps /tmp. Enforced
  # host-side instead: a candidate that writes more than this many MB total
  # into /app/out (across all files, not just predictions.jsonl) has its
  # execution result discarded as a failure.
  out_dir_max_mb: 256
  # Opt-in only - GPU passthrough is an isolation trade-off you must choose
  # explicitly (requires the NVIDIA Container Toolkit on the host). Unset
  # by default, meaning no GPU access at all. Uncomment and pass a value
  # docker's own --gpus flag accepts, e.g. "all" or "device=0".
  # gpus: "all"

dataset:
  # "synthetic" (default) generates the built-in demo dataset. "custom"
  # skips generation entirely and requires train.jsonl/test.jsonl/
  # truth.json to already exist at `path` (any row shape - see
  # eval/dataset.py:validate_custom_dataset and README's "Bring your own
  # project"). size/seed/test_frac below only apply to "synthetic".
  mode: synthetic
  path: "dummy_data"
  size: 1000
  # seed intentionally omitted: leaving it unset makes eval/dataset.py
  # generate a fresh, secret, host-only seed for the held-out labels
  # instead of a fixed/public one a candidate could replay - see
  # eval/dataset.py:generate_split's docstring. Only set this to a fixed
  # value for a reproducible test fixture, never for a real run.
  test_frac: 0.25
  # The held-out portion (test_frac of the whole dataset) is split AGAIN
  # into a "selection" set (test.jsonl - what every progressive-scaling
  # stage and the baseline gate actually score against) and a sealed
  # "holdout" set (holdout.jsonl - scored exactly once, after a candidate
  # has already cleared every stage, and NEVER used to gate a merge
  # decision). holdout_frac is the fraction OF THE HELD-OUT PORTION, not of
  # the whole dataset. This exists because gating every merge decision on
  # the SAME selection set, repeatedly, across many candidates and
  # generations, ratchets the "best known score" upward on that set's own
  # sampling noise as much as on genuine improvement - the holdout score
  # (shown on the dashboard alongside the selection score) is a much more
  # honest estimate of real generalization precisely because it was never
  # used to buy the merge.
  holdout_frac: 0.5

eval:
  stages:
    - subset_percentage: 1
      threshold: 0.5
    - subset_percentage: 5
      threshold: 0.6
    - subset_percentage: 20
      threshold: 0.7
    - subset_percentage: 100
      threshold: 0.8
  # A merge requires score > baseline + min_improvement, not just
  # score >= threshold - see eval/baseline.py.
  #
  # CHOOSE THIS RELATIVE TO YOUR SELECTION SET'S SAMPLING NOISE, not as a
  # fixed small number. A binary-accuracy score measured on n held-out rows
  # has a standard error of roughly sqrt(p*(1-p)/n) - e.g. at n=250 (this
  # config's default test_frac/holdout_frac on the 1000-row default
  # dataset) and p~0.9, that's roughly 0.019 (about 2 points). The default
  # 0.001 here is far smaller than that noise floor: on a task already near
  # its achievable ceiling, a min_improvement this small will merge
  # candidates that are indistinguishable from noise from the one they
  # "beat", not real improvement. Set it to at least one, ideally several,
  # standard errors of your actual dataset/metric before treating a merge
  # decision as evidence of genuine improvement - the holdout_frac split
  # above gives you a second, unused-for-gating score to sanity-check this
  # against.
  min_improvement: 0.001
  state_path: "state.json"
  # Dotted "module:function" implementing (preds, truth) -> (score, reason) -
  # defaults to the built-in binary-accuracy scorer. Only meaningful to
  # change alongside dataset.mode: custom - see README's "Bring your own
  # project".
  # scorer: "your_module.scoring:score"

# Sequential mode only (--mode sequential, the default)
orchestrator:
  max_iterations: 1
  target_score: 1.0
  patience: 1

# Evolutionary mode only (--mode evolutionary)
evolution:
  population_size: 5
  max_generations: 3
  max_concurrent_sandboxes: 3
  duplicate_threshold: 0.25
  selection_strategy: tournament
  scoring_strategy: pareto
  random_seed: 42

generation:
  max_retrieved_failures: 2
  max_retrieved_successes: 2
  prompt_char_budget: 4000
  # "mock" (default) needs no network or API key - MockLLMClient always
  # implements the same honest baseline solution. "anthropic" calls the
  # real Claude API (ANTHROPIC_API_KEY from the environment, never from
  # this file) - see generation/patch_generator.py:AnthropicClient. "local"
  # calls an OpenAI-compatible local server (Ollama/vLLM/llama.cpp/...) -
  # no key, no cost, but a weaker model means more malformed-diff retries -
  # see generation/patch_generator.py:LocalLLMClient.
  client: mock
  # model: claude-sonnet-5
  # For client: local only -
  # model: qwen2.5-coder:32b
  # base_url: http://localhost:11434/v1
  # How many times anthropic/local retry a git-apply failure, feeding the
  # real error back into the next prompt, before giving up on that
  # candidate slot - defaults to 3 if unset. A smaller/weaker local model
  # often needs more shots to land a clean diff.
  # max_apply_retries: 3

# Human-approval gate on merges. enabled defaults to true even if this whole
# section is removed or malformed - see approval/gate.py:resolve_approval_config.
# Run the dashboard (uvicorn api.main:app) to approve/reject pending candidates;
# with nobody running it, candidates will sit pending until timeout_seconds
# elapses, then are held (never merged) rather than treated as approved.
approval:
  enabled: true
  timeout_seconds: 1800
  poll_interval_seconds: 5
  db_path: "approvals.db"
