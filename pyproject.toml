[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-lite"
version = "0.1.0"
description = "An autonomous ML research agent loop: propose, sandbox-evaluate, and merge or roll back candidate patches, with human approval and RAG-style memory."
readme = "README.md"
# SPDX string, not the deprecated `{ file = "LICENSE" }` table form -
# setuptools warns the table form stops being supported 2027-02-18.
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Suchit Sachin Chopade" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "chromadb>=0.4",
    "fastapi>=0.108",
    "uvicorn>=0.25",
    "jinja2>=3.1",
    "httpx>=0.25",
    "python-multipart>=0.0.9",
    "anthropic>=0.119",
]

[project.urls]
Homepage = "https://github.com/suchitchopade3110-arch/autoresearch_lite"
Repository = "https://github.com/suchitchopade3110-arch/autoresearch_lite"
Issues = "https://github.com/suchitchopade3110-arch/autoresearch_lite/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autoresearch = "orchestrator.run:main"

[tool.setuptools]
py-modules = ["config_schema"]

[tool.setuptools.packages.find]
include = [
    "approval*",
    "api*",
    "eval*",
    "evolution*",
    "generation*",
    "memory*",
    "observability*",
    "orchestrator*",
    "reporting*",
    "sandbox*",
    "vcs*",
]

[tool.setuptools.package-data]
# Non-.py files setuptools.packages.find never picks up on its own - the
# dashboard's HTML/CSS (api/main.py already resolves both via
# os.path.dirname(__file__), not CWD, so bundling is the only thing
# missing) and the sandbox image's build context (Dockerfile +
# requirements-sandbox.txt - see sandbox/executor.py's _build_image,
# which resolves this same directory via __file__ rather than CWD too).
api = ["templates/*.html", "static/*.css"]
sandbox = ["Dockerfile", "requirements-sandbox.txt"]
